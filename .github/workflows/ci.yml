name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: naija
          POSTGRES_PASSWORD: naija
          POSTGRES_DB: naija_einvoice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naija -d naija_einvoice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://naija:naija@localhost:5432/naija_einvoice?schema=public
      # Integration tests share the CI database (no separate test DB in CI).
      DATABASE_URL_TEST: postgresql://naija:naija@localhost:5432/naija_einvoice?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Push schema
        run: pnpm db:push

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm build
