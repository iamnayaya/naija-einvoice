services:
  postgres:
    image: postgres:16-alpine
    container_name: naija-postgres
    environment:
      POSTGRES_USER: naija
      POSTGRES_PASSWORD: naija
      POSTGRES_DB: naija_einvoice
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the dedicated integration-test database on first boot.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U naija -d naija_einvoice']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: naija-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
